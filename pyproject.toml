[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ares_print_analyzer"
version = "0.0.1"
authors = [{ name = "AFRL", email = "AFRL.RX.AREScontact@us.af.mil" }]
description = "Athena Analyzer"
license = "MIT"
requires-python = "== 3.11"

dependencies = [
  "PyAres (>=0.1.0)",
  "bpy",
  "numpy",
  "opencv-python",
  "opencv-python-contribs",
  "ffmpeg-python",
  "scipy"
]

[project.urls]
"Homepage" = "https://github.com/AFRL-ARES"
