[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ares_print_analyzer"
version = "0.8.0"
authors = [{ name = "AFRL", email = "AFRL.RX.AREScontact@us.af.mil" }]
description = "Athena Analyzer"
license = "MIT"
requires-python = ">= 3.11"

dependencies = [
  "PyAres (>=1.0.0b1)",
  "bpy (==5.0.1)",
  "numpy",
  "opencv-python",
  "opencv-contrib-python",
  "ffmpeg-python",
  "scipy",
  "scikit-image",
  "pandas",
]

[project.urls]
"Homepage" = "https://github.com/AFRL-ARES"
